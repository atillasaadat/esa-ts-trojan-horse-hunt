[project]
name = "esa-ts-trojan-horse-hunt"
version = "0.1.0"
description = "Trojan trigger reconstruction in time-series forecasting models"
readme = "README.md"
requires-python = ">=3.11.9"
dependencies = [
    "darts==0.33.0",
    "ipykernel>=6.29.5",
    "scikit-learn==1.6.1",
    "scipy==1.15.3",
    "torch==2.6.0",
    "ipykernel",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "wandb>=0.15.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "pathlib2>=2.3.0",
]

[project.scripts]
trojan-hunt = "src.main:app"
